name: Benchmark

# Manual only: shared runners are noisy, so results are informational and
# never gate a merge. Numbers land on the run summary and as an artifact.
on:
  workflow_dispatch:
    inputs:
      requests:
        description: Requests per scenario
        default: "1000"

jobs:
  latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Run latency benchmark
        env:
          REQUESTS: ${{ inputs.requests }}
        run: |
          mkdir -p var/bench
          python -m benchmarks.latency --requests "$REQUESTS" --json var/bench/results.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: var/bench/
