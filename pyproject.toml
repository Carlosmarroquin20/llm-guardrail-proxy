[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-guardrail-proxy"
version = "0.5.1"
description = "Local, zero-egress security and cost guardrail proxy for external LLM APIs."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Carlosmarroquin20" }]
keywords = ["llm", "guardrails", "proxy", "secret-scanning", "pii", "finops", "openai", "anthropic"]

# Runtime requirements are duplicated in requirements.txt for tooling that
# does not consume PEP 621 metadata (e.g. ``pip install -r``).
dependencies = [
    "tiktoken==0.8.0",
    "pydantic==2.9.2",
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.2",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
]

[project.urls]
Homepage = "https://github.com/Carlosmarroquin20/llm-guardrail-proxy"
Repository = "https://github.com/Carlosmarroquin20/llm-guardrail-proxy"
Issues = "https://github.com/Carlosmarroquin20/llm-guardrail-proxy/issues"

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]
# Phase 3b — Presidio-backed PII detection. Optional because of the
# spaCy + language-model footprint (~80 MB total). Operators opt in via
# ``pip install -e .[pii]`` followed by ``python -m spacy download en_core_web_sm``.
pii = [
    "presidio-analyzer==2.2.355",
]
# Phase 4b — DuckDB-backed audit sink. Optional to keep base installs
# light; ``pip install -e .[duckdb]`` brings the ~50 MB wheel.
duckdb = [
    "duckdb==1.1.3",
]

[project.scripts]
llm-guardrail-proxy = "llm_guardrail_proxy.__main__:main"
llm-guardrail-scan = "llm_guardrail_proxy.cli.scan:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]
ignore = [
    # ``__all__`` lists are grouped by role (factories, configuration,
    # pipeline contract, ...) on purpose; alphabetising them loses that.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# The dashboard is an embedded HTML/CSS/JS document stored as a string
# constant; wrapping its markup to 100 columns would hurt readability.
"src/llm_guardrail_proxy/proxy/stats/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional extras: CI type-checks without the ~80 MB PII stack installed,
# and the import is lazy inside ``PiiScanner.__init__`` anyway.
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["llm_guardrail_proxy"]
